name: Deploy Static Site to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # Supports GitHub Variables or Secrets (repo/org/environment scoped).
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME || secrets.S3_BUCKET_NAME }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required variables
        run: |
          test -n "$S3_BUCKET_NAME" || (echo "Missing S3_BUCKET_NAME (set as GitHub Variable or Secret)" && exit 1)
          test -n "$AWS_ROLE_ARN" || (echo "Missing AWS_ROLE_ARN (set as GitHub Variable or Secret)" && exit 1)

          # Normalize common input mistakes (e.g. s3://bucket-name/).
          NORMALIZED_BUCKET="$(printf '%s' "$S3_BUCKET_NAME" | tr -d '\r\n' | xargs)"
          NORMALIZED_BUCKET="${NORMALIZED_BUCKET#s3://}"
          NORMALIZED_BUCKET="${NORMALIZED_BUCKET%%/*}"
          NORMALIZED_BUCKET="${NORMALIZED_BUCKET%/}"
          NORMALIZED_BUCKET="${NORMALIZED_BUCKET%\"}"
          NORMALIZED_BUCKET="${NORMALIZED_BUCKET#\"}"
          NORMALIZED_BUCKET="${NORMALIZED_BUCKET%\'}"
          NORMALIZED_BUCKET="${NORMALIZED_BUCKET#\'}"

          test -n "$NORMALIZED_BUCKET" || (echo "S3_BUCKET_NAME resolved to an empty value after normalization" && exit 1)
          if ! [[ "$NORMALIZED_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "Invalid S3_BUCKET_NAME format. Use only the raw bucket name (3-63 chars, lowercase letters, numbers, dots, hyphens)."
            echo "Diagnostics: length=${#NORMALIZED_BUCKET}, has_uppercase=$([[ "$NORMALIZED_BUCKET" =~ [A-Z] ]] && echo yes || echo no), has_underscore=$([[ "$NORMALIZED_BUCKET" == *"_"* ]] && echo yes || echo no), has_space=$([[ "$NORMALIZED_BUCKET" == *" "* ]] && echo yes || echo no)"
            exit 1
          fi

          echo "S3_BUCKET_NAME=$NORMALIZED_BUCKET" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync . "s3://${S3_BUCKET_NAME}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"
